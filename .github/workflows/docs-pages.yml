name: Public documentation

on:
  pull_request:
    paths:
      - "docs/site/**"
      - "docs/publication.json"
      - ".github/workflows/docs-pages.yml"
  push:
    branches: [master]
    paths:
      - "docs/site/**"
      - "docs/publication.json"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

concurrency:
  group: public-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the public repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/site/requirements.txt
      - name: Install pinned Sphinx dependencies
        run: python -m pip install --require-hashes --requirement docs/site/requirements.txt
      - name: Build guides with warnings as errors
        env:
          BMATRIX_DOCS_BASEURL: https://tibarbosa.github.io/bmatrix-releases/
        run: python -m sphinx -E -a -n -W --keep-going -b html docs/site docs/_build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the public repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/site/requirements.txt
      - name: Install pinned Sphinx dependencies
        run: python -m pip install --require-hashes --requirement docs/site/requirements.txt
      - name: Build guides
        env:
          BMATRIX_DOCS_BASEURL: https://tibarbosa.github.io/bmatrix-releases/
        run: python -m sphinx -E -a -n -W --keep-going -b html docs/site docs/_build/html
      - name: Upload the generated Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html
      - name: Deploy the validated Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
